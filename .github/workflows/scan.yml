name: ALPHA XK Scanner
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL (e.g. http://testphp.vulnweb.com/)'
        required: true
        default: 'http://testphp.vulnweb.com/'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests beautifulsoup4 urllib3

      - name: Run Active Scan (Python)
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          python3 scanner.py

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan_report.json